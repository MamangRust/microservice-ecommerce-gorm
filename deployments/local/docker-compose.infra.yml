# docker-compose.infra.yml — Infra-only stack for running Go services locally.
#
# Runs ONLY the infrastructure:
#   20 per-service PostgreSQL databases (ports 5543-5562), Redis, Kafka (KRaft),
#   ClickHouse, and optional observability tools.
#
# The Go services are NOT part of this compose file — they are started
# locally via `go run service/<name>/cmd/main.go` (see `just services-local-start`).
#
# Kafka uses a dual-listener setup so both Docker clients (kafka-exporter,
# INTERNAL listener kafka:19092) and host clients (local Go services,
# EXTERNAL listener localhost:9092) can connect.
#
# Usage:
#   docker compose -f deployments/local/docker-compose.infra.yml up -d
#   docker compose -f deployments/local/docker-compose.infra.yml down
#   docker compose -f deployments/local/docker-compose.infra.yml --profile monitoring up -d

name: ecommerce-infra

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_ecommerce
    command: ["postgres", "-c", "max_connections=400", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: ECOMMERCE
    ports:
      - "5432:5432"
    volumes:
      - postgres_ecommerce_data:/var/lib/postgresql/data
    networks:
      - app_ecommerce_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d ECOMMERCE"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    container_name: redis-ecommerce-e2e
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - redis_ecommerce_data:/data
      - ../../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    networks:
      - app_ecommerce_network
    healthcheck:
      # redis/redis.conf sets requirepass; plain `redis-cli ping` would fail
      # with NOAUTH. Authenticate explicitly so the healthcheck is meaningful.
      test: ["CMD-SHELL", "redis-cli -a dragon_knight ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka in KRaft mode (broker+controller), no zookeeper needed.
  # Dual listeners:
  #   INTERNAL kafka:19092  -> for Docker clients (kafka-exporter)
  #   EXTERNAL localhost:9092 -> for host clients (local Go services)
  kafka:
    image: apache/kafka:latest
    container_name: my-kafka-ecommerce
    ports:
      - "9092:9092"
    environment:
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_NODE_ID=1
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_KRAFT_CLUSTER_ID=kraft-cluster-01
      - KAFKA_LOG_DIRS=/tmp/kafka-data
    networks:
      - app_ecommerce_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter_ecommerce
    ports:
      - "9308:9308"
    networks:
      - app_ecommerce_network
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=kafka:19092"
      - "--web.listen-address=0.0.0.0:9308"
      - "--log.level=debug"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9308/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector-ecommerce
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../../observability/otel-collector.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "8889:8889"
    networks:
      - app_ecommerce_network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger-ecommerce
    ports:
      - "6831:6831/udp"
      - "16686:16686"
    networks:
      - app_ecommerce_network
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_ecommerce
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/rules:/etc/prometheus/rules
    networks:
      - app_ecommerce_network
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_ecommerce
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
    volumes:
      - grafana_ecommerce-storage:/var/lib/grafana
      - ../../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - app_ecommerce_network
    depends_on:
      - prometheus
      - jaeger
      - alertmanager
      - loki

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager_ecommerce
    volumes:
      - ../../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    networks:
      - app_ecommerce_network

  loki:
    container_name: loki_ecommerce
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - ../../observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_ecommerce_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app_ecommerce_network

  promtail:
    container_name: promtail_ecommerce
    image: grafana/promtail:2.9.0
    volumes:
      - ../../observability/promtail-config.yaml:/etc/promtail/config.yaml
      - ./logs:/var/log/app
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - app_ecommerce_network

  node-exporter:
    image: quay.io/prometheus/node-exporter
    container_name: node-exporter_ecommerce
    pid: "host"
    networks:
      - app_ecommerce_network
    volumes:
      - "/:/host:ro,rslave"
    command:
      - '--path.rootfs=/host'

  # ─── Per-service PostgreSQL databases (ports 5543-5562) ────────────────
  auth-db: &per-svc-db
    image: postgres:17-alpine
    command: ["postgres", "-c", "max_connections=400", "-c", "shared_buffers=256MB"]
    container_name: postgres_auth
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: auth_db
    ports:
      - "5543:5432"
    networks:
      - app_ecommerce_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  role-db:
    <<: *per-svc-db
    container_name: postgres_role
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: role_db
    ports:
      - "5544:5432"

  user-db:
    <<: *per-svc-db
    container_name: postgres_user
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: user_db
    ports:
      - "5545:5432"

  email-db:
    <<: *per-svc-db
    container_name: postgres_email
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: email_db
    ports:
      - "5546:5432"

  category-db:
    <<: *per-svc-db
    container_name: postgres_category
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: category_db
    ports:
      - "5547:5432"

  merchant-db:
    <<: *per-svc-db
    container_name: postgres_merchant
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: merchant_db
    ports:
      - "5548:5432"

  merchant_award-db:
    <<: *per-svc-db
    container_name: postgres_merchant_award
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: merchant_award_db
    ports:
      - "5549:5432"

  merchant_business-db:
    <<: *per-svc-db
    container_name: postgres_merchant_business
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: merchant_business_db
    ports:
      - "5550:5432"

  merchant_detail-db:
    <<: *per-svc-db
    container_name: postgres_merchant_detail
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: merchant_detail_db
    ports:
      - "5551:5432"

  merchant_policy-db:
    <<: *per-svc-db
    container_name: postgres_merchant_policy
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: merchant_policy_db
    ports:
      - "5552:5432"

  order-db:
    <<: *per-svc-db
    container_name: postgres_order
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: order_db
    ports:
      - "5553:5432"

  order_item-db:
    <<: *per-svc-db
    container_name: postgres_order-item
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: order_item_db
    ports:
      - "5554:5432"

  product-db:
    <<: *per-svc-db
    container_name: postgres_product
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: product_db
    ports:
      - "5555:5432"

  transaction-db:
    <<: *per-svc-db
    container_name: postgres_transaction
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: transaction_db
    ports:
      - "5556:5432"

  cart-db:
    <<: *per-svc-db
    container_name: postgres_cart
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: cart_db
    ports:
      - "5557:5432"

  review-db:
    <<: *per-svc-db
    container_name: postgres_review
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: review_db
    ports:
      - "5558:5432"

  review_detail-db:
    <<: *per-svc-db
    container_name: postgres_review_detail
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: review_detail_db
    ports:
      - "5559:5432"

  slider-db:
    <<: *per-svc-db
    container_name: postgres_slider
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: slider_db
    ports:
      - "5560:5432"

  shipping_address-db:
    <<: *per-svc-db
    container_name: postgres_shipping_address
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: shipping_address_db
    ports:
      - "5561:5432"

  banner-db:
    <<: *per-svc-db
    container_name: postgres_banner
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: banner_db
    ports:
      - "5562:5432"

  # ClickHouse — OLAP engine for the stats pipeline (F3). stats-writer
  # materializes stats.ecommerce.*.event topics here; stats-reader serves the
  # stats gRPC contracts from these tables. The init script applies
  # pkg/clickhouse/schema.sql on first boot (idempotent CREATE TABLE IF NOT
  # EXISTS); stats-writer also applies it at startup for robustness.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: clickhouse-ecommerce
    ports:
      - "9000:9000"
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_ecommerce_data:/var/lib/clickhouse
      - ../../pkg/clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - app_ecommerce_network
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  loki_ecommerce_data:
  grafana_ecommerce-storage:
  postgres_ecommerce_data:
  kafka_ecommerce_data:
  redis_ecommerce_data:
  clickhouse_ecommerce_data:
  postgres_auth_data:
  postgres_role_data:
  postgres_user_data:
  postgres_email_data:
  postgres_category_data:
  postgres_merchant_data:
  postgres_merchant_award_data:
  postgres_merchant_business_data:
  postgres_merchant_detail_data:
  postgres_merchant_policy_data:
  postgres_order_data:
  postgres_order-item_data:
  postgres_product_data:
  postgres_transaction_data:
  postgres_cart_data:
  postgres_review_data:
  postgres_review_detail_data:
  postgres_slider_data:
  postgres_shipping_address_data:
  postgres_banner_data:

networks:
  app_ecommerce_network:
    driver: bridge
